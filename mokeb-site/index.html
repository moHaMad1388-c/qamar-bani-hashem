
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موکب جوانان قمر بنی هاشم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar">
    <h2>موکب</h2>
    <ul>
        <li>داشبورد</li>
        <li>نذری</li>
        <li>دخل و خرج</li>
        <li>اعضا</li>
        <li>اطلاعیه‌ها</li>
    </ul>
</div>

<div class="main">
    <header>
        <img src="logo.png" class="logo">
        <div>
            <h1>موکب جوانان قمر بنی هاشم</h1>
            <p>پنل مدیریت هیئت و نذری</p>
        </div>
    </header>

    <section class="cards">
        <div class="card">
            <h3>اعضا</h3>
            <p>124 نفر</p>
        </div>
        <div class="card">
            <h3>نذری امروز</h3>
            <p>850 پرس</p>
        </div>
        <div class="card">
            <h3>موجودی صندوق</h3>
            <p>28,000,000 تومان</p>
        </div>
    </section>

    <section class="panel">
        <h2>ثبت دخل و خرج</h2>
        <input placeholder="عنوان هزینه یا درآمد">
        <input placeholder="مبلغ">
        <button>ثبت</button>
    </section>

    <section class="panel">
        <h2>ثبت نذری</h2>
        <input placeholder="نوع نذری">
        <input placeholder="تعداد">
        <button>ثبت نذری</button>
    </section>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موکب جوانان قمر بنی هاشم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>موکب</h2>
    <ul>
        <li>داشبورد</li>
        <li>اعضا</li>
        <li>نذری</li>
        <li>دخل و خرج</li>
        <li>اطلاعیه‌ها</li>
    </ul>
</div>

<div class="main">

<header>
    <div>
        <h1>موکب جوانان قمر بنی هاشم</h1>
        <p>سامانه مدیریت موکب و هیئت</p>
    </div>
</header>

<div class="stats">
    <div class="card">
        <h3>اعضا</h3>
        <p id="memberCount">0</p>
    </div>
    <div class="card">
        <h3>نذری ثبت شده</h3>
        <p id="nazriCount">0</p>
    </div>
    <div class="card">
        <h3>تراکنش‌ها</h3>
        <p id="moneyCount">0</p>
    </div>
</div>

<div class="grid">

<section class="panel">
<h2>افزودن عضو</h2>
<input id="memberName" placeholder="نام عضو">
<button onclick="addMember()">ثبت عضو</button>
<ul id="members"></ul>
</section>

<section class="panel">
<h2>ثبت نذری</h2>
<input id="nazriName" placeholder="نوع نذری">
<input id="nazriAmount" placeholder="تعداد">
<button onclick="addNazri()">ثبت نذری</button>
<ul id="nazriList"></ul>
</section>

<section class="panel">
<h2>ثبت دخل و خرج</h2>
<input id="moneyTitle" placeholder="عنوان">
<input id="moneyValue" placeholder="مبلغ">
<select id="moneyType">
<option value="income">درآمد</option>
<option value="expense">هزینه</option>
</select>
<button onclick="addMoney()">ثبت تراکنش</button>
<ul id="moneyList"></ul>
</section>

</div>
</div>

<script src="script.js"></script>
</body>
</html>

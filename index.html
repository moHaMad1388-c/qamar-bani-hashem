
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موکب جوانان قمر بنی هاشم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>موکب جوانان قمر بنی هاشم</h1>

<div class="card">
<h2>افزودن عضو</h2>
<input id="memberName" placeholder="نام عضو">
<button onclick="addMember()">ثبت عضو</button>
<ul id="members"></ul>
</div>

<div class="card">
<h2>ثبت نذری</h2>
<input id="nazriName" placeholder="نوع نذری">
<input id="nazriCount" placeholder="تعداد">
<button onclick="addNazri()">ثبت نذری</button>
<ul id="nazriList"></ul>
</div>

<div class="card">
<h2>دخل و خرج</h2>
<input id="moneyTitle" placeholder="عنوان">
<input id="moneyAmount" placeholder="مبلغ">
<select id="moneyType">
<option value="income">درآمد</option>
<option value="expense">هزینه</option>
</select>
<button onclick="addMoney()">ثبت</button>
<ul id="moneyList"></ul>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
